
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xxxaaaattt - Party Alerts</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: radial-gradient(circle at center, #38206c, #090914 75%);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

main {
  width: 90%;
  max-width: 600px;
  padding: 25px;
  border: 1px solid #bd75ff;
  border-radius: 28px;
  background: #101020ee;
  box-shadow: 0 0 35px #a64dff66;
}

h1 {
  color: #e5b5ff;
  font-size: 48px;
  margin-bottom: 5px;
  text-shadow: 0 0 20px #bd75ff;
}

.subtitle {
  letter-spacing: 4px;
  color: #c7a4ff;
  font-size: 12px;
}

#status {
  color: #8fffd5;
  font-size: 13px;
  margin: 20px 0;
}

#alert {
  position: relative;
  padding: 35px 15px;
  margin: 20px 0;
  min-height: 280px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  border-radius: 22px;
  overflow: hidden;
  background: linear-gradient(135deg,#35145c,#161633);
  border: 1px solid #d56aff;
  box-shadow: inset 0 0 25px #a64dff33;
}

#alert.active {
  animation: glow 1.2s infinite alternate;
}

.gift {
  font-size: 85px;
  filter: drop-shadow(0 0 15px #ff4bd8);
}

.who {
  color: #ffe66d;
  font-size: 27px;
  font-weight: bold;
  margin-top: 15px;
  text-shadow: 0 0 15px #ffcf4d;
}

.what {
  font-size: 21px;
  margin-top: 12px;
  color: #fff;
}

.thanks {
  color: #ff9bea;
  font-weight: bold;
  font-size: 16px;
  margin-top: 15px;
  letter-spacing: 2px;
}

button {
  padding: 14px 25px;
  border: 0;
  border-radius: 30px;
  font-weight: bold;
  cursor: pointer;
  color: #160c2a;
  background: linear-gradient(90deg,#ff4bd8,#bd75ff,#4df6ff);
  box-shadow: 0 0 20px #bd75ff66;
}

button:hover {
  transform: scale(1.05);
}

.particle {
  position: absolute;
  pointer-events: none;
  font-size: 20px;
  animation: float 1.8s ease-out forwards;
}

@keyframes glow {
  from { box-shadow: 0 0 15px #bd75ff55; }
  to { box-shadow: 0 0 45px #ff4bd8aa; }
}

@keyframes float {
  from {
    opacity: 1;
    transform: translateY(0) scale(.5) rotate(0deg);
  }
  to {
    opacity: 0;
    transform: translateY(-180px) scale(1.5) rotate(40deg);
  }
}

@keyframes entrance {
  0% { transform: scale(.4) rotate(-10deg); opacity: 0; }
  65% { transform: scale(1.15) rotate(5deg); opacity: 1; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}
</style>
</head>

<body>
<main>
  <h1>xxxaaaattt</h1>
  <p class="subtitle">TIKTOK PARTY ALERTS</p>
  <p id="status">Conectando...</p>

  <section id="alert">
    <div class="gift">🎁</div>
    <div class="who">¡Bienvenido!</div>
    <div class="what">Esperando regalos...</div>
    <div class="thanks">PREPARADOS PARA LA FIESTA ✨</div>
  </section>

  <button onclick="test()">PROBAR ALERTA 🌹</button>
</main>

<script>
const statusBox = document.getElementById("status");
const alertBox = document.getElementById("alert");

let hideTimer;
let audioContext;

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  }[c]));
}

function playSound() {
  try {
    audioContext = audioContext || new
      (window.AudioContext || window.webkitAudioContext)();

    if (audioContext.state === "suspended") {
      audioContext.resume();
    }

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(660, audioContext.currentTime);
    oscillator.frequency.setValueAtTime(880, audioContext.currentTime + .12);

    gain.gain.setValueAtTime(.15, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001, audioContext.currentTime + .5);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + .5);
  } catch (error) {
    console.log("Sonido no disponible", error);
  }
}

function particles() {
  const symbols = ["✨","💜","🌸","💖","⭐"];

  for (let i = 0; i < 18; i++) {
    const particle = document.createElement("span");
    particle.className = "particle";
    particle.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    particle.style.left = Math.random() * 90 + "%";
    particle.style.top = (45 + Math.random() * 45) + "%";
    particle.style.animationDelay = Math.random() * .5 + "s";

    alertBox.appendChild(particle);

    setTimeout(() => particle.remove(), 2500);
  }
}

function showGift(user, gift, repeat) {
  clearTimeout(hideTimer);

  const isRose = String(gift).toLowerCase().includes("rosa") ||
                 String(gift).toLowerCase().includes("rose");

  const emoji = isRose ? "🌹" : "🎁";

  alertBox.innerHTML = `
    <div class="gift">${emoji}✨</div>
    <div class="thanks">¡NUEVO REGALO!</div>
    <div class="who">${escapeHTML(user)}</div>
    <div class="what">ha enviado ${escapeHTML(gift)}
    ${repeat > 1 ? " ×" + repeat : ""}</div>
    <div class="thanks">¡MUCHÍSIMAS GRACIAS! 💜</div>
  `;

  alertBox.classList.remove("active");
  void alertBox.offsetWidth;
  alertBox.classList.add("active");

  const giftElement = alertBox.querySelector(".gift");
  giftElement.style.animation = "entrance .7s ease-out";

  particles();
  playSound();

  hideTimer = setTimeout(() => {
    alertBox.classList.remove("active");
    alertBox.innerHTML = `
      <div class="gift">🎁</div>
      <div class="who">¡Bienvenido!</div>
      <div class="what">Esperando regalos...</div>
      <div class="thanks">PREPARADOS PARA LA FIESTA ✨</div>
    `;
  }, 7000);
}

function test() {
  showGift("Invitado de prueba", "Rosa", 1);
}

function connect() {
  const protocol = location.protocol === "https:" ? "wss:" : "ws:";
  const socket = new WebSocket(protocol + "//" + location.host);

  socket.onmessage = event => {
    const data = JSON.parse(event.data);

    if (data.type === "status") {
      statusBox.textContent = data.text;
    }

    if (data.type === "gift") {
      showGift(data.user, data.gift, data.repeat || 1);
    }
  };

  socket.onclose = () => {
    statusBox.textContent = "Reconectando...";
    setTimeout(connect, 3000);
  };

  socket.onerror = () => {
    statusBox.textContent = "Error de comunicación";
  };
}

connect();
</script>
</body>
</html>
